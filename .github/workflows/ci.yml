name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: osint-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies for Node tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3
      - name: Static checks and tests
        run: npm run check
      - name: Verify Electron native dependency rebuild
        run: npx electron-builder install-app-deps
