<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة العلاقات التفاعلية - OSINT Tool</title>
    
    <!-- vis.js CSS -->
    <link href="../../node_modules/vis-network/dist/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* الشريط الجانبي للتحكم */
        .sidebar {
            width: 300px;
            background: #16213e;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }

        .sidebar h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .control-group select,
        .control-group input {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            color: #eee;
            font-size: 0.9rem;
        }

        .control-group button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .control-group button:hover {
            transform: translateY(-2px);
        }

        .stats {
            background: #0f3460;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .stats .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .stats .stat-value {
            color: #00d4ff;
            font-weight: bold;
        }

        /* منطقة الرسم */
        .graph-container {
            flex: 1;
            position: relative;
        }

        #network {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
        }

        /* لوحة المعلومات */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00d4ff;
            min-width: 300px;
            max-width: 400px;
            display: none;
            z-index: 1000;
        }

        .info-panel.show {
            display: block;
        }

        .info-panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .info-panel .info-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0f3460;
        }

        .info-panel .info-label {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .info-panel .info-value {
            color: #eee;
            font-size: 0.95rem;
        }

        .info-panel .close-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e74c3c;
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* أزرار التحكم السريع */
        .quick-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .quick-controls button {
            padding: 12px 20px;
            background: rgba(22, 33, 62, 0.9);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-controls button:hover {
            background: #00d4ff;
            color: #16213e;
        }

        /* Legend */
        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #00d4ff;
        }

        .legend h4 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- الشريط الجانبي -->
        <div class="sidebar">
            <h2>🔍 التحكم في الرسم البياني</h2>
            
            <div class="control-group">
                <label>تصفية حسب المنصة</label>
                <select id="platformFilter" multiple>
                    <option value="all" selected>الكل</option>
                    <option value="twitter">Twitter</option>
                    <option value="facebook">Facebook</option>
                    <option value="instagram">Instagram</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="github">GitHub</option>
                </select>
            </div>

            <div class="control-group">
                <label>نوع العلاقة</label>
                <select id="edgeTypeFilter">
                    <option value="all" selected>جميع العلاقات</option>
                    <option value="high">ثقة عالية فقط (80%+)</option>
                    <option value="medium">ثقة متوسطة (50-80%)</option>
                    <option value="low">ثقة منخفضة (&lt;50%)</option>
                </select>
            </div>

            <div class="control-group">
                <label>نوع التخطيط</label>
                <select id="layoutType">
                    <option value="physics" selected>فيزيائي (Physics)</option>
                    <option value="hierarchical">هرمي (Hierarchical)</option>
                    <option value="circular">دائري (Circular)</option>
                </select>
            </div>

            <div class="control-group">
                <button onclick="applyFilters()">تطبيق الفلاتر</button>
            </div>

            <div class="control-group">
                <button onclick="resetView()">إعادة تعيين العرض</button>
            </div>

            <div class="control-group">
                <button onclick="exportGraph()">تصدير الرسم</button>
            </div>

            <div class="stats">
                <h3 style="color: #00d4ff; margin-bottom: 15px;">الإحصائيات</h3>
                <div class="stat-item">
                    <span>العقد (Nodes):</span>
                    <span class="stat-value" id="nodeCount">0</span>
                </div>
                <div class="stat-item">
                    <span>العلاقات (Edges):</span>
                    <span class="stat-value" id="edgeCount">0</span>
                </div>
                <div class="stat-item">
                    <span>المنصات:</span>
                    <span class="stat-value" id="platformCount">0</span>
                </div>
                <div class="stat-item">
                    <span>متوسط الثقة:</span>
                    <span class="stat-value" id="avgConfidence">0%</span>
                </div>
            </div>
        </div>

        <!-- منطقة الرسم -->
        <div class="graph-container">
            <div id="network"></div>

            <!-- لوحة المعلومات -->
            <div class="info-panel" id="infoPanel">
                <button class="close-btn" onclick="closeInfo()">×</button>
                <h3 id="infoTitle">معلومات العقدة</h3>
                <div id="infoContent"></div>
            </div>

            <!-- Legend -->
            <div class="legend">
                <h4>دليل الألوان</h4>
                <div class="legend-item">
                    <div class="legend-color" style="background: #3498db;"></div>
                    <span>الشخص المستهدف</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #e74c3c;"></div>
                    <span>حسابات اجتماعية</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f39c12;"></div>
                    <span>تسريبات</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #9b59b6;"></div>
                    <span>نطاقات</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #1abc9c;"></div>
                    <span>بيانات إضافية</span>
                </div>
            </div>

            <!-- أزرار التحكم السريع -->
            <div class="quick-controls">
                <button onclick="zoomIn()">🔍 تكبير</button>
                <button onclick="zoomOut()">🔍 تصغير</button>
                <button onclick="fitView()">📐 ملائمة</button>
                <button onclick="togglePhysics()">⚡ الفيزياء</button>
            </div>
        </div>
    </div>

    <!-- vis.js Library -->
    <script src="../../node_modules/vis-network/dist/vis-network.min.js"></script>
    
    <script>
        let network;
        let allNodes, allEdges;
        let physicsEnabled = true;

        // تهيئة الرسم البياني
        function initNetwork(data) {
            const container = document.getElementById('network');
            
            allNodes = new vis.DataSet(data.nodes);
            allEdges = new vis.DataSet(data.edges);
            
            const networkData = {
                nodes: allNodes,
                edges: allEdges
            };
            
            const options = {
                nodes: {
                    shape: 'dot',
                    size: 20,
                    font: {
                        size: 14,
                        color: '#ffffff',
                        face: 'Tahoma'
                    },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    width: 2,
                    color: { inherit: 'from' },
                    smooth: {
                        type: 'continuous'
                    },
                    arrows: {
                        to: { enabled: true, scaleFactor: 0.5 }
                    },
                    font: {
                        size: 10,
                        color: '#ffffff',
                        align: 'middle'
                    }
                },
                physics: {
                    enabled: true,
                    barnesHut: {
                        gravitationalConstant: -2000,
                        centralGravity: 0.3,
                        springLength: 200,
                        springConstant: 0.04
                    },
                    stabilization: {
                        iterations: 150
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200,
                    zoomView: true,
                    dragView: true
                }
            };
            
            network = new vis.Network(container, networkData, options);
            
            // الأحداث
            network.on('click', onNodeClick);
            network.on('hoverNode', onNodeHover);
            network.on('stabilized', updateStats);
            
            updateStats();
        }

        // عند النقر على عقدة
        function onNodeClick(params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = allNodes.get(nodeId);
                showNodeInfo(node);
            }
        }

        // عند التمرير على عقدة
        function onNodeHover(params) {
            const nodeId = params.node;
            const node = allNodes.get(nodeId);
            // يمكن إضافة tooltip مخصص هنا
        }

        // عرض معلومات العقدة
        function showNodeInfo(node) {
            const panel = document.getElementById('infoPanel');
            const title = document.getElementById('infoTitle');
            const content = document.getElementById('infoContent');
            
            title.textContent = node.label;
            
            let html = '';
            html += `<div class="info-item">
                        <div class="info-label">النوع</div>
                        <div class="info-value">${node.type || 'غير محدد'}</div>
                     </div>`;
            
            if (node.platform) {
                html += `<div class="info-item">
                            <div class="info-label">المنصة</div>
                            <div class="info-value">${node.platform}</div>
                         </div>`;
            }
            
            if (node.url) {
                html += `<div class="info-item">
                            <div class="info-label">الرابط</div>
                            <div class="info-value"><a href="${node.url}" target="_blank" style="color: #00d4ff;">${node.url}</a></div>
                         </div>`;
            }
            
            if (node.confidence) {
                html += `<div class="info-item">
                            <div class="info-label">مستوى الثقة</div>
                            <div class="info-value">${node.confidence}%</div>
                         </div>`;
            }
            
            content.innerHTML = html;
            panel.classList.add('show');
        }

        // إغلاق لوحة المعلومات
        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('show');
        }

        // تطبيق الفلاتر
        function applyFilters() {
            // تنفيذ منطق التصفية
            updateStats();
        }

        // إعادة تعيين العرض
        function resetView() {
            network.fit();
        }

        // تكبير
        function zoomIn() {
            const scale = network.getScale();
            network.moveTo({ scale: scale * 1.2 });
        }

        // تصغير
        function zoomOut() {
            const scale = network.getScale();
            network.moveTo({ scale: scale * 0.8 });
        }

        // ملائمة العرض
        function fitView() {
            network.fit({ animation: true });
        }

        // تبديل الفيزياء
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            network.setOptions({ physics: { enabled: physicsEnabled } });
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('nodeCount').textContent = allNodes.length;
            document.getElementById('edgeCount').textContent = allEdges.length;
            
            // حساب عدد المنصات الفريدة
            const platforms = new Set();
            allNodes.forEach(node => {
                if (node.platform) platforms.add(node.platform);
            });
            document.getElementById('platformCount').textContent = platforms.size;
            
            // حساب متوسط الثقة
            let totalConfidence = 0;
            let count = 0;
            allEdges.forEach(edge => {
                if (edge.confidence) {
                    totalConfidence += edge.confidence;
                    count++;
                }
            });
            const avgConfidence = count > 0 ? Math.round(totalConfidence / count) : 0;
            document.getElementById('avgConfidence').textContent = avgConfidence + '%';
        }

        // تصدير الرسم
        function exportGraph() {
            // يمكن تصدير كصورة أو JSON
            alert('سيتم إضافة ميزة التصدير قريباً');
        }

        // تحميل البيانات من Electron
        window.addEventListener('DOMContentLoaded', () => {
            // استقبال البيانات من العملية الرئيسية
            window.electronAPI.onGraphData((data) => {
                initNetwork(data);
            });
            
            // طلب البيانات
            window.electronAPI.requestGraphData();
        });
    </script>
</body>
</html>
